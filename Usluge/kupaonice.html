    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #101820, #263746);
        color: white;
        text-align: center;
    }

    .container {
        max-width: 650px;
        padding: 45px 30px;
        border: 1px solid #52616d;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    }

    h1 {
        color: #4fbae4;
        font-size: 32px;
        margin-bottom: 20px;
    }

    h2 {
        font-size: 21px;
        font-weight: normal;
    }

    p {
        font-size: 17px;
        line-height: 1.7;
        color: #e0e0e0;
    }

    .logo {
        font-size: 35px;
        font-weight: bold;
        margin-bottom: 35px;
    }

    .footer {
        margin-top: 35px;
        font-size: 14px;
        color: #aaa;
    }
</style>

<body>
    <div class="container">

    <div class="logo">KK <span style="color: #4fbae4">Tehnik</span></div>

    </p>

</div>
